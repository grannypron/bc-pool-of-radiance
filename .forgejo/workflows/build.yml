# Build and test every push to main and every pull request. Version tags also create releases. Each run rebuilds the
# v1.1, v1.2, and v1.3 tags and compares them with SSI's original executables.
#
# workflow_dispatch with a tag releases it, even one that predates this workflow: it uses that tag's src/ and build/
# directories with the current scripts/ and release scripts. With the tag left empty it only builds and tests main, as
# a push does, without making a tag (and so without notifying the repository's watchers).
#
# Every night (08:00 UTC) the schedule publishes main as the rolling pre-release "nightly" when main has changed since
# the last production release and since the current nightly (#1108); otherwise the scheduled run does nothing. The
# nightly tag moves to the commit built, and the release keeps its name and download links, so watchers hear of it
# once. Dispatching with the tag nightly publishes main as the nightly at once, whether or not it changed. The plan job
# decides, for every run, whether the other jobs run, whether it publishes, and which tag.
#
# Publishing waits for both the normal build and historical reproduction jobs. A toolchain or image change that
# alters SSI's executables therefore stops the release.
#
# Linux jobs use the image named by CI_IMAGE. It contains proprietary DOS toolchains and is never published:
#   forge.schkerke.com       forge.schkerke.com/brian/dosbox-x-ci@sha256:<digest>, pulled with REGISTRY_USER and
#                            REGISTRY_TOKEN; docker buildx imagetools inspect forge.schkerke.com/brian/dosbox-x-ci:<tag>
#                            prints the digest of a newly pushed image.
#   forgejo.brazencrows.com  local/dosbox-x-ci:<date>, loaded into its runner over SFTP (brazencrows.com's
#                            provisioning/bc-forgejo-runner/load-ci-image.sh); there is no registry, so the credentials
#                            fall back to 'none', which the runner never uses for an image it already has.
# A rebuilt image is not used until CI_IMAGE is updated.
#
# Pull requests from forks are blocked because their code would run inside the private image. Checkout uses git
# directly instead of actions/checkout, so jobs do not download actions from another service.
#
# The native job builds and tests the Linux and Windows ports in the same image, which holds the MinGW
# cross-compilers and Wine. The setup scripts download build/toolchain's Free Pascal and SDL3 from goldbox-toolchain's
# releases on this forge into FPC_PREFIX (/opt/fpc), and never compile them here (TOOLCHAIN_FETCH_ONLY): a pin with no
# release fails the job until it is tagged in goldbox-toolchain. release-native packages each target with
# package-native.sh and attaches it to the DOS release. Both jobs run only when the repository variable NATIVE_CI is
# 'true' (#1106).
#
# macOS jobs run directly on the private Apple Silicon runner, not in the Linux image. The macos job builds and tests
# every push and pull request. release-macos signs, notarizes, staples, packages, and uploads the app after the DOS
# release exists. The runner caches the pinned Free Pascal and SDL builds.
#
# Signing uses a Developer ID .p12 through rcodesign because services launched by launchd cannot see the login
# keychain. Notarization uses an App Store Connect API key. Both live under /etc/forgejo-runner/signing and are
# readable only by ci-runner; Forgejo never receives them.

# Forgejo splits this YAML while parsing jobs, so YAML anchors do not work reliably. The duplicated container and
# checkout definitions must remain synchronized. (bms, 2026-10-16)

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: A version tag to release (v1.1), nightly to publish main now, or empty to build and test only
        required: false
        type: string

jobs:
  # What this run does: run (the build and test jobs), publish (the release jobs), tag (what they release) and base
  # (for a nightly, the production release its notes count from).
  plan:
    runs-on: docker
    timeout-minutes: 5
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    outputs:
      run: ${{ steps.plan.outputs.run }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ github.token }}
        run: |
          run=true publish=false tag="" base=""
          # nightly FORCE: publish this commit as the nightly unless main is the last production release, or (without
          # FORCE) the nightly already is this commit.
          nightly() {
              auth="Authorization: token $TOKEN"
              base="$(curl -fsS -H "$auth" "$REPO_API/releases?limit=50" \
                  | jq -r '[.[] | select((.draft or .prerelease) | not)][0].tag_name // empty')"
              [ -n "$base" ] || { echo "No production release to count the nightly from." >&2; exit 1; }
              base_sha="$(curl -fsS -H "$auth" "$REPO_API/tags/$base" | jq -r .commit.sha)"
              nightly_sha="$(curl -sS -H "$auth" "$REPO_API/tags/nightly" | jq -r '.commit.sha // empty')"
              if [ "$SHA" = "$base_sha" ]; then
                  run=false
                  echo "main is $base, the last production release: no nightly."
              elif [ "$1" = 0 ] && [ "$SHA" = "$nightly_sha" ]; then
                  run=false
                  echo "nightly is already $SHA."
              else
                  publish=true tag=nightly
                  echo "Publishing $SHA as nightly, counted from $base."
              fi
          }
          case "$EVENT" in
              pull_request) [ "$PR_REPO" = "$REPO" ] || run=false ;;
              push) case "$REF" in refs/tags/v*) publish=true tag="$REF_NAME" ;; esac ;;
              workflow_dispatch)
                  case "$INPUT_TAG" in
                      "") ;;
                      nightly) nightly 1 ;;
                      *) publish=true tag="$INPUT_TAG" ;;
                  esac ;;
              schedule) nightly 0 ;;
          esac
          printf 'run=%s\npublish=%s\ntag=%s\nbase=%s\n' "$run" "$publish" "$tag" "$base" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: docker
    # build.sh gives DOSBox-X ten minutes; this catches hangs elsewhere in the job.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    env:
      # The DOS toolchains live in the image.
      TOOLS: /drive_d
    steps:
      # Fetch all branches and tags because reproduction and release jobs refer to historical tags.
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Build and run the unit tests
        run: scripts/build.sh --test

  reproduce:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: docker
    # build.sh gives DOSBox-X ten minutes; this catches hangs elsewhere in the job.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        # Keep this list synchronized with .forgejo/ssi-releases.txt.
        tag: [v1.1, v1.2, v1.3]
    env:
      TOOLS: /drive_d
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Rebuild ${{ matrix.tag }} and compare with SSI's release
        run: .forgejo/scripts/reproduce.sh "${{ matrix.tag }}"

  release:
    needs: [plan, build, reproduce]
    if: needs.plan.outputs.publish == 'true'
    runs-on: docker
    # build.sh gives DOSBox-X ten minutes; this catches hangs elsewhere in the job.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    env:
      TOOLS: /drive_d
      # The tag pushed, the tag dispatched, or nightly (the plan job's choice).
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch' && env.TAG != 'nightly'
        run: |
          # Require an existing tag; otherwise Forgejo could create that name at the current main commit.
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          # Replace both directories so files added after the tag, such as build/toolchain, cannot leak into the build.
          rm -rf src build
          git checkout "$TAG" -- src build
          # Give archive members the tag commit's timestamp, matching a tag-triggered release.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"
          # HEAD remains the dispatching commit, so explicitly use the tag for the build ID (#849).
          echo "BUILD_REF=$TAG" >> "$GITHUB_ENV"

      # The release jobs that follow check out this same commit, and release.sh finds the release by this tag.
      - name: Point the nightly tag at this commit
        if: env.TAG == 'nightly'
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" push -q -f origin HEAD:refs/tags/nightly
          git tag -f nightly HEAD

      # Historical reproduction has already verified this source and image are deterministic.
      - name: Build
        run: scripts/build.sh

      - name: Package
        run: scripts/package.sh "$TAG"

      - name: Release
        env:
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_BASE: ${{ needs.plan.outputs.base }}
        run: .forgejo/scripts/release.sh "$TAG"

  native:
    needs: [plan]
    if: vars.NATIVE_CI == 'true' && needs.plan.outputs.run == 'true'
    runs-on: docker
    # The toolchain is downloaded, never built here; the Windows tests under Wine take the longest.
    timeout-minutes: 30
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        target: [x86_64-linux, i386-linux, x86_64-win64, i386-win32]
    env:
      FPC_PREFIX: /opt/fpc
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Toolchain (Free Pascal and SDL3, from goldbox-toolchain's releases)
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          TOOLCHAIN_FETCH_ONLY: 1
        run: |
          # https://<forge>/talonius/pool-of-radiance.git, less its owner and name.
          export TOOLCHAIN_RELEASES="${CLONE_URL%/*/*}/talonius/goldbox-toolchain/releases/download"
          scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      # Windows tests run under Wine.
      - name: Run the ${{ matrix.target }} unit tests
        run: scripts/build-native.sh --test ${{ matrix.target }}
      - name: Build ${{ matrix.target }}
        run: scripts/build-native.sh ${{ matrix.target }}

  release-native:
    needs: [plan, release, native]
    if: vars.NATIVE_CI == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: docker
    timeout-minutes: 30
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            archive: linux-x86_64.tar.gz
          - target: i386-linux
            archive: linux-i386.tar.gz
          - target: x86_64-win64
            archive: windows-x64.zip
          - target: i386-win32
            archive: windows-x86.zip
    env:
      FPC_PREFIX: /opt/fpc
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch' && env.TAG != 'nightly'
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          rm -rf src build
          git checkout "$TAG" -- src build
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"
          echo "BUILD_REF=$TAG" >> "$GITHUB_ENV"
      - name: Toolchain (Free Pascal and SDL3, from goldbox-toolchain's releases)
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          TOOLCHAIN_FETCH_ONLY: 1
        run: |
          # https://<forge>/talonius/pool-of-radiance.git, less its owner and name.
          export TOOLCHAIN_RELEASES="${CLONE_URL%/*/*}/talonius/goldbox-toolchain/releases/download"
          scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      - name: Build ${{ matrix.target }}
        run: scripts/build-native.sh ${{ matrix.target }}
      - name: Package
        run: scripts/package-native.sh "$TAG" ${{ matrix.target }}
      - name: Attach to the release
        env:
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release-asset.sh "$TAG" "dist/pool-of-radiance-$TAG-${{ matrix.archive }}"

  macos:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: macos-arm64
    # Cached toolchains make this quick; the first run must build Free Pascal and SDL3.
    timeout-minutes: 120
    steps:
      # macOS base64 lacks -w0, and this persistent workspace may contain a previous job.
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote remove origin 2> /dev/null || true
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth" fetch -q --tags --force origin '+refs/heads/*:refs/remotes/origin/*' \
              "+$REF:refs/ci/head"
          git checkout -q -f --detach "$SHA"
          git clean -qfdx
      - name: Toolchain (Free Pascal and SDL3, built once)
        run: scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      - name: Run the native unit tests
        run: scripts/build-native.sh --test macos
      - name: Build the app
        run: scripts/build-native.sh macos

  release-macos:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-arm64
    # Allow for notarization even though Apple usually responds within a few minutes.
    timeout-minutes: 120
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote remove origin 2> /dev/null || true
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth" fetch -q --tags --force origin '+refs/heads/*:refs/remotes/origin/*' \
              "+$REF:refs/ci/head"
          git checkout -q -f --detach "$SHA"
          git clean -qfdx
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch' && env.TAG != 'nightly'
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          rm -rf src build
          git checkout "$TAG" -- src build
          echo "BUILD_REF=$TAG" >> "$GITHUB_ENV"
      - name: Toolchain (Free Pascal and SDL3, built once)
        run: scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      - name: Build the app
        run: scripts/build-native.sh macos
      - name: Sign, notarize and staple
        env:
          SIGN_P12: /etc/forgejo-runner/signing/developer-id.p12
          SIGN_P12_PASSWORD_FILE: /etc/forgejo-runner/signing/developer-id.p12-password
          NOTARY_KEY: /etc/forgejo-runner/signing/notary-key.p8
        run: |
          export NOTARY_KEY_ID="$(cat /etc/forgejo-runner/signing/notary-key-id)"
          export NOTARY_ISSUER="$(cat /etc/forgejo-runner/signing/notary-issuer)"
          scripts/macos-sign.sh
      # Put project data files beside the stapled app, where the game expects them. They remain outside the signed
      # bundle. The archive unpacks directly into a game directory, and docs/dist-readmes/macos-readme.txt explains how
      # the app locates retail data and chooses its writable save directory (#1064).
      - name: Package
        run: |
          stage="$(mktemp -d)"
          ditto "obj/native/macos/Pool of Radiance.app" "$stage/Pool of Radiance.app"
          [ ! -d src/binaries ] || find src/binaries -maxdepth 1 -type f -exec cp {} "$stage/" \;
          cp docs/dist-readmes/macos-readme.txt "$stage/README.TXT"
          mkdir -p dist
          rm -f "dist/pool-of-radiance-$TAG-macos.zip"
          (cd "$stage" && ditto -c -k --sequesterRsrc . "$OLDPWD/dist/pool-of-radiance-$TAG-macos.zip")
          rm -rf "$stage"
          unzip -l "dist/pool-of-radiance-$TAG-macos.zip" | tail -n 3
      - name: Attach to the release
        env:
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release-asset.sh "$TAG" "dist/pool-of-radiance-$TAG-macos.zip"
