# Build every push to main and every pull request; release every pushed version tag.
#
# A release can also be cut for a tag that predates this workflow: run it by hand (workflow_dispatch) with the tag.
# The tag's src/ and build/build.bat are built with the current scripts.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and release, for example v1.1
        required: true

jobs:
  build:
    runs-on: docker
    container:
      image: forge.schkerke.com/brian/dosbox-x-ci:1
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      # The DOS toolchains live in the image.
      TOOLS: /drive_d
      # The version being released: the dispatched tag, or the pushed one.
      TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git checkout "$TAG" -- src build/build.bat
          # Date the zip's files by the tag's commit, as a pushed tag would.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Package
        if: env.RELEASE == 'true'
        run: ./package.sh "$TAG"

      - name: Release
        if: env.RELEASE == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release.sh "$TAG"
