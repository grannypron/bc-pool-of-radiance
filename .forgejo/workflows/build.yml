# Build and test every push to main and every pull request. Version tags also create releases. Each run rebuilds the
# v1.1, v1.2, and v1.3 tags and compares them with SSI's original executables.
#
# workflow_dispatch can release a tag that predates this workflow. It uses that tag's src/ and build/ directories
# with the current scripts/ and release scripts.
#
# Publishing waits for both the normal build and historical reproduction jobs. A toolchain or image change that
# alters SSI's executables therefore stops the release.
#
# Linux jobs use the image named by CI_IMAGE. It contains proprietary DOS toolchains and is never published:
#   forge.schkerke.com       forge.schkerke.com/brian/dosbox-x-ci@sha256:<digest>, pulled with REGISTRY_USER and
#                            REGISTRY_TOKEN; docker buildx imagetools inspect forge.schkerke.com/brian/dosbox-x-ci:<tag>
#                            prints the digest of a newly pushed image.
#   forgejo.brazencrows.com  local/dosbox-x-ci:<date>, loaded into its runner over SFTP (brazencrows.com's
#                            provisioning/bc-forgejo-runner/load-ci-image.sh); there is no registry, so the credentials
#                            fall back to 'none', which the runner never uses for an image it already has.
# A rebuilt image is not used until CI_IMAGE is updated.
#
# Pull requests from forks are blocked because their code would run inside the private image. Checkout uses git
# directly instead of actions/checkout, so jobs do not download actions from another service.
#
# The native job builds and tests the Linux and Windows ports in the same image, which also holds the pinned Free
# Pascal and SDL3 builds under FPC_PREFIX (/opt/fpc), the MinGW cross-compilers and Wine. The setup scripts reuse
# those installs; when build/toolchain's pins move past the image's, they build the new ones in the job until the
# image is rebuilt. release-native packages each target with package-native.sh and attaches it to the DOS release.
# Both jobs run only when the repository variable NATIVE_CI is 'true', which is set once CI_IMAGE has that
# toolchain (#1106).
#
# macOS jobs run directly on the private Apple Silicon runner, not in the Linux image. The macos job builds and tests
# every push and pull request. release-macos signs, notarizes, staples, packages, and uploads the app after the DOS
# release exists. The runner caches the pinned Free Pascal and SDL builds.
#
# Signing uses a Developer ID .p12 through rcodesign because services launched by launchd cannot see the login
# keychain. Notarization uses an App Store Connect API key. Both live under /etc/forgejo-runner/signing and are
# readable only by ci-runner; Forgejo never receives them.

# Forgejo splits this YAML while parsing jobs, so YAML anchors do not work reliably. The duplicated container and
# checkout definitions must remain synchronized. (bms, 2026-10-16)

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and release, for example v1.1
        required: true
        type: string

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    # build.sh gives DOSBox-X ten minutes; this catches hangs elsewhere in the job.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    env:
      # The DOS toolchains live in the image.
      TOOLS: /drive_d
    steps:
      # Fetch all branches and tags because reproduction and release jobs refer to historical tags.
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Build and run the unit tests
        run: scripts/build.sh --test

  reproduce:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    # build.sh gives DOSBox-X ten minutes; this catches hangs elsewhere in the job.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        # Keep this list synchronized with .forgejo/ssi-releases.txt.
        tag: [v1.1, v1.2, v1.3]
    env:
      TOOLS: /drive_d
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Rebuild ${{ matrix.tag }} and compare with SSI's release
        run: .forgejo/scripts/reproduce.sh "${{ matrix.tag }}"

  release:
    needs: [build, reproduce]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    # build.sh gives DOSBox-X ten minutes; this catches hangs elsewhere in the job.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    env:
      TOOLS: /drive_d
      # Release the manually selected tag or the tag that triggered the workflow.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Require an existing tag; otherwise Forgejo could create that name at the current main commit.
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          # Replace both directories so files added after the tag, such as build/toolchain, cannot leak into the build.
          rm -rf src build
          git checkout "$TAG" -- src build
          # Give archive members the tag commit's timestamp, matching a tag-triggered release.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"
          # HEAD remains the dispatching commit, so explicitly use the tag for the build ID (#849).
          echo "BUILD_REF=$TAG" >> "$GITHUB_ENV"

      # Historical reproduction has already verified this source and image are deterministic.
      - name: Build
        run: scripts/build.sh

      - name: Package
        run: scripts/package.sh "$TAG"

      - name: Release
        env:
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release.sh "$TAG"

  native:
    if: >-
      vars.NATIVE_CI == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: docker
    # The image's toolchain makes this quick; a job that must build its own needs much longer.
    timeout-minutes: 90
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        target: [x86_64-linux, x86_64-win64, i386-win32]
    env:
      FPC_PREFIX: /opt/fpc
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Toolchain (Free Pascal and SDL3, already in the image)
        run: scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      # Windows tests run under Wine.
      - name: Run the ${{ matrix.target }} unit tests
        run: scripts/build-native.sh --test ${{ matrix.target }}
      - name: Build ${{ matrix.target }}
        run: scripts/build-native.sh ${{ matrix.target }}

  release-native:
    needs: [release, native]
    if: vars.NATIVE_CI == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: docker
    timeout-minutes: 90
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            archive: linux-x86_64.tar.gz
          - target: x86_64-win64
            archive: windows-x64.zip
          - target: i386-win32
            archive: windows-x86.zip
    env:
      FPC_PREFIX: /opt/fpc
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          rm -rf src build
          git checkout "$TAG" -- src build
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"
          echo "BUILD_REF=$TAG" >> "$GITHUB_ENV"
      - name: Toolchain (Free Pascal and SDL3, already in the image)
        run: scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      - name: Build ${{ matrix.target }}
        run: scripts/build-native.sh ${{ matrix.target }}
      - name: Package
        run: scripts/package-native.sh "$TAG" ${{ matrix.target }}
      - name: Attach to the release
        env:
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release-asset.sh "$TAG" "dist/pool-of-radiance-$TAG-${{ matrix.archive }}"

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-arm64
    # Cached toolchains make this quick; the first run must build Free Pascal and SDL3.
    timeout-minutes: 120
    steps:
      # macOS base64 lacks -w0, and this persistent workspace may contain a previous job.
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote remove origin 2> /dev/null || true
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth" fetch -q --tags --force origin '+refs/heads/*:refs/remotes/origin/*' \
              "+$REF:refs/ci/head"
          git checkout -q -f --detach "$SHA"
          git clean -qfdx
      - name: Toolchain (Free Pascal and SDL3, built once)
        run: scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      - name: Run the native unit tests
        run: scripts/build-native.sh --test macos
      - name: Build the app
        run: scripts/build-native.sh macos

  release-macos:
    needs: [release]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-arm64
    # Allow for notarization even though Apple usually responds within a few minutes.
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote remove origin 2> /dev/null || true
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth" fetch -q --tags --force origin '+refs/heads/*:refs/remotes/origin/*' \
              "+$REF:refs/ci/head"
          git checkout -q -f --detach "$SHA"
          git clean -qfdx
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          rm -rf src build
          git checkout "$TAG" -- src build
          echo "BUILD_REF=$TAG" >> "$GITHUB_ENV"
      - name: Toolchain (Free Pascal and SDL3, built once)
        run: scripts/fpc-setup.sh && scripts/sdl3-setup.sh
      - name: Build the app
        run: scripts/build-native.sh macos
      - name: Sign, notarize and staple
        env:
          SIGN_P12: /etc/forgejo-runner/signing/developer-id.p12
          SIGN_P12_PASSWORD_FILE: /etc/forgejo-runner/signing/developer-id.p12-password
          NOTARY_KEY: /etc/forgejo-runner/signing/notary-key.p8
        run: |
          export NOTARY_KEY_ID="$(cat /etc/forgejo-runner/signing/notary-key-id)"
          export NOTARY_ISSUER="$(cat /etc/forgejo-runner/signing/notary-issuer)"
          scripts/macos-sign.sh
      # Put project data files beside the stapled app, where the game expects them. They remain outside the signed
      # bundle. The archive unpacks directly into a game directory, and scripts/macos-readme.txt explains how the app
      # locates retail data and chooses its writable save directory (#1064).
      - name: Package
        run: |
          stage="$(mktemp -d)"
          ditto "obj/native/macos/Pool of Radiance.app" "$stage/Pool of Radiance.app"
          [ ! -d src/binaries ] || find src/binaries -maxdepth 1 -type f -exec cp {} "$stage/" \;
          cp scripts/macos-readme.txt "$stage/README.TXT"
          mkdir -p dist
          rm -f "dist/pool-of-radiance-$TAG-macos.zip"
          (cd "$stage" && ditto -c -k --sequesterRsrc . "$OLDPWD/dist/pool-of-radiance-$TAG-macos.zip")
          rm -rf "$stage"
          unzip -l "dist/pool-of-radiance-$TAG-macos.zip" | tail -n 3
      - name: Attach to the release
        env:
          REPO_API: ${{ github.event.repository.url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release-asset.sh "$TAG" "dist/pool-of-radiance-$TAG-macos.zip"
